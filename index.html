<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mi Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#FAF6EF;
    --ink:#20281F;
    --card:#FFFFFF;
    --line:#E6DFCF;
    --green:#2E6B4F;
    --green-dark:#204E3A;
    --rust:#B2451F;
    --muted:#7A7364;
    --danger:#B4342A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;position:relative;overflow:hidden;}

  header{padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--paper);gap:10px;}
  header h1{font-family:'Fraunces',serif;font-weight:700;font-size:20px;margin:0;letter-spacing:-0.01em;flex:1;}
  .icon-btn{border:1.5px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:100px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .icon-btn svg{width:18px;height:18px;color:var(--ink);}
  .cart-pill{display:flex;align-items:center;gap:8px;background:var(--green);color:#fff;padding:10px 16px;border-radius:100px;font-weight:700;font-size:15px;border:none;flex:0 0 auto;}
  .cart-pill .count{background:rgba(255,255,255,.25);border-radius:100px;padding:1px 9px;font-size:13px;}

  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px;}

  .tabs-row{display:flex;gap:8px;padding:14px 16px 4px;overflow-x:auto;}
  .tab-chip{flex:0 0 auto;padding:9px 16px;border-radius:100px;border:1.5px solid var(--line);background:var(--card);font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap;}
  .tab-chip.active{background:var(--ink);border-color:var(--ink);color:var(--paper);}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px;}
  .prod-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0;text-align:left;display:flex;flex-direction:column;gap:0;min-height:150px;overflow:hidden;}
  .prod-thumb{width:100%;height:88px;object-fit:cover;background:#EFE9DA;}
  .prod-emoji{font-size:30px;line-height:1;height:88px;display:flex;align-items:center;justify-content:center;background:#EFE9DA;}
  .prod-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .prod-name{font-weight:700;font-size:15px;line-height:1.2;}
  .prod-stock{font-size:12px;color:var(--muted);}
  .prod-stock.low{color:var(--rust);font-weight:700;}
  .prod-price{margin-top:auto;font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:var(--green-dark);}
  .empty-msg{padding:40px 24px;text-align:center;color:var(--muted);font-size:16px;line-height:1.5;}

  nav.bottom{position:absolute;bottom:0;left:0;right:0;display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom);}
  nav.bottom button{flex:1;border:none;background:none;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:600;font-family:inherit;}
  nav.bottom button.active{color:var(--green-dark);}
  nav.bottom svg{width:24px;height:24px;}

  .sheet-backdrop{position:absolute;inset:0;background:rgba(20,24,18,.42);z-index:20;display:flex;align-items:flex-end;}
  .sheet{background:var(--paper);width:100%;max-height:88%;border-radius:22px 22px 0 0;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));}
  .sheet h2{font-family:'Fraunces',serif;font-size:21px;margin:2px 0 14px;}
  .sheet-close{position:sticky;top:0;text-align:right;}
  .sheet-close button{border:none;background:var(--line);width:32px;height:32px;border-radius:100px;font-size:16px;color:var(--ink);}

  .cart-line{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
  .cart-line .info{flex:1;}
  .cart-line .name{font-weight:700;font-size:16px;}
  .cart-line .unit{font-size:13px;color:var(--muted);}
  .qty-ctrl{display:flex;align-items:center;gap:10px;}
  .qty-ctrl button{width:32px;height:32px;border-radius:100px;border:1.5px solid var(--line);background:#fff;font-size:18px;font-weight:700;color:var(--ink);}
  .qty-ctrl .n{min-width:20px;text-align:center;font-weight:700;font-size:16px;}
  .line-total{font-weight:700;min-width:64px;text-align:right;font-family:'Fraunces',serif;}

  .total-row{display:flex;justify-content:space-between;align-items:baseline;padding:18px 2px 6px;}
  .total-row .label{font-size:16px;color:var(--muted);font-weight:600;}
  .total-row .amount{font-family:'Fraunces',serif;font-size:32px;font-weight:700;}

  .btn{display:block;width:100%;text-align:center;padding:16px;border-radius:14px;border:none;font-size:17px;font-weight:700;font-family:inherit;margin-top:10px;}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-primary:disabled{background:var(--line);color:var(--muted);}
  .btn-outline{background:none;border:1.5px solid var(--line);color:var(--ink);}
  .btn-danger{background:none;color:var(--danger);font-weight:600;}

  label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:14px 0 6px;}
  input, select{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:16px;font-family:inherit;background:#fff;color:var(--ink);}
  .field-row{display:flex;gap:8px;align-items:stretch;}
  .field-row input{flex:1;}
  .field-row .icon-btn{width:48px;height:48px;}

  .fab{position:absolute;right:18px;bottom:96px;width:56px;height:56px;border-radius:100px;background:var(--rust);color:#fff;border:none;font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,.18);z-index:5;}

  .history-item{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);}
  .history-item .when{font-size:13px;color:var(--muted);}
  .history-item .amt{font-family:'Fraunces',serif;font-weight:700;font-size:17px;}

  .emoji-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .emoji-row button{width:44px;height:44px;font-size:22px;border-radius:10px;border:1.5px solid var(--line);background:#fff;}
  .emoji-row button.sel{border-color:var(--green);background:#EAF3EE;}

  .stock-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);gap:10px;}
  .stock-row .thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#EFE9DA;flex:0 0 auto;}
  .stock-row .emoji-thumb{width:44px;height:44px;border-radius:10px;background:#EFE9DA;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;}
  .stock-row .nm{font-weight:700;font-size:15px;}
  .stock-row .cat{font-size:13px;color:var(--muted);}
  .stock-row .info{flex:1;min-width:0;}

  .photo-preview{width:100%;height:150px;border-radius:12px;background:#EFE9DA;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:8px;color:var(--muted);font-size:14px;}
  .photo-preview img{width:100%;height:100%;object-fit:cover;}

  #scannerOverlay{position:absolute;inset:0;background:#000;z-index:40;display:none;flex-direction:column;}
  #scannerOverlay.show{display:flex;}
  #scannerRegion{flex:1;}
  .scanner-top{padding:16px;display:flex;justify-content:space-between;align-items:center;}
  .scanner-top span{color:#fff;font-weight:700;}
  .scanner-top button{background:rgba(255,255,255,.15);color:#fff;border:none;width:36px;height:36px;border-radius:100px;font-size:16px;}
  .scanner-hint{color:#fff;text-align:center;padding:14px;font-size:14px;opacity:.85;}

</style>
</head>
<body>
<div id="app">

  <header>
    <button class="icon-btn" onclick="openSettings()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
    <h1 id="storeTitle">Mi Tienda</h1>
    <button class="cart-pill" onclick="openCart()">🛒 <span id="cartTotal">$0</span> <span class="count" id="cartCount">0</span></button>
  </header>

  <main id="main"></main>

  <button class="fab" id="fab" onclick="openAddProduct()" style="display:none;">+</button>

  <nav class="bottom">
    <button id="tabVender" class="active" onclick="setScreen('vender')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Vender
    </button>
    <button id="tabProductos" onclick="setScreen('productos')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>
      Productos
    </button>
    <button id="tabHistorial" onclick="setScreen('historial')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Historial
    </button>
  </nav>

  <div id="sheetHost"></div>

  <div id="scannerOverlay">
    <div class="scanner-top"><span>Escanear código</span><button onclick="stopScanner()">✕</button></div>
    <div id="scannerRegion"></div>
    <div class="scanner-hint">Apunta la cámara al código de barras o QR del producto</div>
  </div>
</div>

<script>
// =====================================================================
// CONFIGURACIÓN DE FIREBASE — reemplaza estos valores por los de tu
// propio proyecto gratis de Firebase (ver instrucciones del asistente).
// =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyCZ9xI4F9C7LfudD-sAMQV5CEAHMutoULU",
  authDomain: "mi-tienda-f28f0.firebaseapp.com",
  projectId: "mi-tienda-f28f0",
  storageBucket: "mi-tienda-f28f0.firebasestorage.app",
  messagingSenderId: "752047294614",
  appId: "1:752047294614:web:5dd3ba2142cf716c771ab7"
};
const firebaseReady = !firebaseConfig.apiKey.includes('PEGA_AQUI');
let db = null, storeDocRef = null;
if(firebaseReady){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  storeDocRef = db.collection('tienda').doc('datos');
}

let products = [];
let sales = [];
let clients = [];
let settings = {storeName:'Mi Tienda', address:'', phone:''};
let invoiceCounter = 0;
let cart = {};
let currentClient = '';
let screen = 'vender';
let activeCategory = 'Todas';
let sellSearch = '';
let sellSearchFocused = false;
const EMOJIS = ['🍞','🥛','💧','🍫','🧴','🧼','🧃','🥫','🍬','🧻','🥤','🧯','🔋','🧦','🍪','📦'];

async function loadData(){
  if(!firebaseReady){
    alert('Todavía falta conectar la base de datos: abre este archivo con el editor de GitHub y pega tu configuración de Firebase donde dice "PEGA_AQUI".');
    render();
    return;
  }
  try{
    const snap = await storeDocRef.get();
    if(snap.exists){
      const d = snap.data();
      products = d.products || [];
      sales = d.sales || [];
      settings = d.settings || settings;
      invoiceCounter = d.invoiceCounter || 0;
      clients = d.clients || [];
    }
  }catch(e){
    alert('No se pudo conectar a la base de datos. Revisa tu conexión a internet.');
  }
  document.getElementById('storeTitle').textContent = settings.storeName || 'Mi Tienda';
  render();
}
async function saveAll(){
  if(!firebaseReady) return;
  try{
    await storeDocRef.set({products, sales, settings, invoiceCounter, clients});
  }catch(e){
    alert('No se pudo guardar en la base de datos. Revisa tu conexión a internet.');
  }
}
async function saveProducts(){ await saveAll(); }
async function saveSales(){ await saveAll(); }
async function saveSettings(){ await saveAll(); }
async function saveInvoiceCounter(){ await saveAll(); }

function money(n){ return '$' + Number(n).toFixed(2); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function setScreen(s){
  screen = s;
  sellSearchFocused = false;
  document.getElementById('tabVender').classList.toggle('active', s==='vender');
  document.getElementById('tabProductos').classList.toggle('active', s==='productos');
  document.getElementById('tabHistorial').classList.toggle('active', s==='historial');
  document.getElementById('fab').style.display = s==='productos' ? 'block' : 'none';
  render();
}

function categories(){
  const set = new Set(products.map(p=>p.category || 'General'));
  return ['Todas', ...Array.from(set)];
}

function render(){
  const main = document.getElementById('main');
  if(screen === 'vender') renderVender(main);
  else if(screen === 'productos') renderProductos(main);
  else renderHistorial(main);
  updateCartPill();
}

function productThumbHtml(p){
  return p.photo ? `<img class="prod-thumb" src="${p.photo}">` : `<div class="prod-emoji">${p.emoji||'📦'}</div>`;
}

function renderVender(main){
  const cats = categories();
  let html = `<div class="tabs-row">` + cats.map(c =>
    `<button class="tab-chip ${c===activeCategory?'active':''}" onclick="activeCategory='${c.replace(/'/g,"\\'")}';render()">${c}</button>`
  ).join('') + `</div>`;

  html += `<div style="padding:14px 16px 0;">
    <div class="field-row">
      <input id="sellSearchInput" value="${escapeHtml(sellSearch)}" oninput="onSellSearchInput(this)" placeholder="Buscar producto...">
      <button type="button" class="icon-btn" onclick="openScanner('sell')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3"/><path d="M7 8v8M11 8v8M14 8v8M17 8v8"/></svg>
      </button>
    </div>
  </div>`;

  html += `<div style="padding:0 16px 10px;">
    <button class="tab-chip" style="width:100%;text-align:left;display:flex;align-items:center;gap:8px;" onclick="openClientPicker()">
      👤 <span style="font-weight:700;">${currentClient ? escapeHtml(currentClient.name) : 'Sin cliente (toca para agregar)'}</span>
    </button>
  </div>`;

  const q = sellSearch.trim().toLowerCase();
  const list = products.filter(p =>
    (activeCategory==='Todas' || (p.category||'General')===activeCategory) &&
    (q==='' || p.name.toLowerCase().includes(q) || (p.code||'').toLowerCase().includes(q))
  );

  if(list.length===0){
    html += `<div class="empty-msg">${q ? 'No se encontró ningún producto con ese nombre o código.' : 'Todavía no hay productos aquí.<br>Ve a la pestaña "Productos" para agregar el primero.'}</div>`;
  } else {
    html += `<div class="grid">` + list.map(p => {
      const low = p.stock <= 3;
      return `<button class="prod-card" onclick="addToCart('${p.id}')" ${p.stock<=0?'style="opacity:.45" disabled':''}>
        ${productThumbHtml(p)}
        <div class="prod-body">
          <div class="prod-name">${escapeHtml(p.name)}</div>
          <div class="prod-stock ${low?'low':''}">Disponible: ${p.stock}</div>
          <div class="prod-price">${money(p.price)}</div>
        </div>
      </button>`;
    }).join('') + `</div>`;
  }
  main.innerHTML = html;

  if(sellSearchFocused){
    const el = document.getElementById('sellSearchInput');
    if(el){ el.focus(); const v = el.value; el.setSelectionRange(v.length, v.length); }
  }
}

function onSellSearchInput(el){
  sellSearch = el.value;
  sellSearchFocused = true;
  render();
}

function renderProductos(main){
  if(products.length===0){
    main.innerHTML = `<div class="empty-msg">No hay productos todavía.<br>Toca el botón + para agregar uno.</div>`;
    return;
  }
  const byCat = {};
  products.forEach(p=>{ const c=p.category||'General'; (byCat[c]=byCat[c]||[]).push(p); });
  let html = '';
  Object.keys(byCat).forEach(cat=>{
    html += `<div style="padding:14px 16px 0;font-weight:700;color:var(--muted);font-size:14px;">${cat.toUpperCase()}</div>`;
    byCat[cat].forEach(p=>{
      const thumb = p.photo ? `<img class="thumb" src="${p.photo}">` : `<div class="emoji-thumb">${p.emoji||'📦'}</div>`;
      html += `<div class="stock-row" onclick="openAddProduct('${p.id}')">
        ${thumb}
        <div class="info"><div class="nm">${escapeHtml(p.name)}</div><div class="cat">${money(p.price)} · Disponible: ${p.stock}${p.code?' · '+escapeHtml(p.code):''}</div></div>
        <div style="color:var(--muted);font-size:20px;">›</div>
      </div>`;
    });
  });
  main.innerHTML = html;
}

function renderHistorial(main){
  if(sales.length===0){
    main.innerHTML = `<div class="empty-msg">Todavía no se ha registrado ninguna venta.</div>`;
    return;
  }
  const sorted = [...sales].reverse();
  main.innerHTML = sorted.map(s=>{
    const d = new Date(s.date);
    const when = d.toLocaleDateString('es', {day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
    return `<div class="history-item" style="cursor:pointer;" onclick="openSaleDetail('${s.id}')"><div><div class="amt">${money(s.total)}</div><div class="when">Factura ${s.invoice} · ${when} · ${s.items.length} producto(s)${s.client&&s.client.name?' · 👤 '+escapeHtml(s.client.name):''}</div></div><div style="color:var(--muted);font-size:20px;align-self:center;">›</div></div>`;
  }).join('');
}

function openSaleDetail(id){
  const s = sales.find(x=>x.id===id);
  if(!s) return;
  const d = new Date(s.date);
  const when = d.toLocaleDateString('es') + ' · ' + d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
  let body = `<div class="sheet-close"><button onclick="closeSheet()">✕</button></div>
    <h2>Factura ${s.invoice}</h2>
    <div style="color:var(--muted);font-size:14px;margin:-8px 0 12px;">${when}${s.client&&s.client.name?' · 👤 '+escapeHtml(s.client.name):''}</div>`;
  s.items.forEach(it=>{
    body += `<div class="cart-line">
      <div class="info"><div class="name">${escapeHtml(it.name)}</div><div class="unit">${it.qty} x ${money(it.price)}</div></div>
      <div class="line-total">${money(it.price*it.qty)}</div>
    </div>`;
  });
  body += `<div class="total-row"><div class="label">Total</div><div class="amount">${money(s.total)}</div></div>
    <button class="btn btn-primary" onclick="reprintSale('${s.id}')">📄 Descargar / compartir factura</button>`;
  showSheet(body);
}

async function reprintSale(id){
  const s = sales.find(x=>x.id===id);
  if(!s) return;
  await handleReceipt(s);
}

// ---- cart ----
function addToCart(id){
  const p = products.find(x=>x.id===id);
  if(!p || p.stock <= (cart[id]||0)) return;
  cart[id] = (cart[id]||0) + 1;
  updateCartPill();
}
function updateCartPill(){
  const ids = Object.keys(cart);
  const count = ids.reduce((a,id)=>a+cart[id],0);
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = money(cartTotalValue());
}
function cartTotalValue(){
  return Object.keys(cart).reduce((a,id)=>{ const p=products.find(x=>x.id===id); return a + (p?p.price*cart[id]:0); },0);
}

function openCart(){
  const ids = Object.keys(cart).filter(id=>cart[id]>0);
  let body = `<div class="sheet-close"><button onclick="closeSheet()">✕</button></div><h2>Tu carrito</h2>`;
  if(ids.length===0){
    body += `<div class="empty-msg">El carrito está vacío.<br>Toca un producto para agregarlo.</div>`;
  } else {
    body += ids.map(id=>{
      const p = products.find(x=>x.id===id);
      return `<div class="cart-line">
        <div class="info"><div class="name">${escapeHtml(p.name)}</div><div class="unit">${money(p.price)} c/u</div></div>
        <div class="qty-ctrl">
          <button onclick="changeQty('${id}',-1)">−</button>
          <div class="n">${cart[id]}</div>
          <button onclick="changeQty('${id}',1)">+</button>
        </div>
        <div class="line-total">${money(p.price*cart[id])}</div>
      </div>`;
    }).join('');
    body += `<div class="stock-row" style="border:none;padding:10px 0;cursor:pointer;" onclick="closeSheet();openClientPicker();">
      <div class="info"><div class="cat">Cliente</div><div class="nm">${currentClient ? escapeHtml(currentClient.name) : 'Sin cliente'}</div></div>
      <div style="color:var(--muted);">Cambiar ›</div>
    </div>`;
    body += `<div class="total-row"><div class="label">Total</div><div class="amount">${money(cartTotalValue())}</div></div>
    <button class="btn btn-primary" onclick="confirmSale()">Cobrar</button>
    <button class="btn btn-outline" onclick="cart={};closeSheet();render();">Vaciar carrito</button>`;
  }
  showSheet(body);
}
function changeQty(id, delta){
  const p = products.find(x=>x.id===id);
  let n = (cart[id]||0) + delta;
  if(n<0) n=0;
  if(p && n>p.stock) n=p.stock;
  cart[id] = n;
  if(cart[id]===0) delete cart[id];
  openCart();
}

function openClientPicker(){
  let body = `<div class="sheet-close"><button onclick="closeSheet()">✕</button></div><h2>¿Para quién es esta venta?</h2>`;
  if(clients.length){
    body += clients.map((c,i) => `<div class="stock-row" onclick="selectClient(${i})">
      <div class="info"><div class="nm">👤 ${escapeHtml(c.name)}</div>${c.address?`<div class="cat">${escapeHtml(c.address)}</div>`:''}</div>
      <button type="button" onclick="event.stopPropagation();removeClient(${i})" style="border:none;background:none;color:var(--danger);font-weight:700;">Eliminar</button>
    </div>`).join('');
  } else {
    body += `<div class="empty-msg">Todavía no tienes clientes guardados.</div>`;
  }
  body += `<label>Agregar nuevo cliente</label>
    <input id="f_newclient" placeholder="Nombre del cliente">
    <label>Dirección (opcional, sale en la factura)</label>
    <input id="f_newclient_addr" placeholder="Dirección del cliente">
    <button class="btn btn-primary" onclick="addClient()">Agregar y usar</button>`;
  if(currentClient){
    body += `<button class="btn btn-outline" onclick="currentClient='';closeSheet();render();">Vender sin cliente</button>`;
  }
  showSheet(body);
}
function selectClient(i){
  currentClient = clients[i];
  closeSheet();
  render();
}
async function addClient(){
  const name = document.getElementById('f_newclient').value.trim();
  const address = document.getElementById('f_newclient_addr').value.trim();
  if(!name) return;
  const existing = clients.find(c=>c.name===name);
  if(existing){ existing.address = address; }
  else { clients.push({name, address}); }
  await saveAll();
  currentClient = clients.find(c=>c.name===name);
  closeSheet();
  render();
}
async function removeClient(i){
  clients.splice(i,1);
  await saveAll();
  openClientPicker();
}

async function confirmSale(){
  const ids = Object.keys(cart);
  if(ids.length===0) return;
  const client = currentClient;
  currentClient = '';
  const items = ids.map(id=>{
    const p = products.find(x=>x.id===id);
    return {name:p.name, qty:cart[id], price:p.price, code:p.code||''};
  });
  const total = cartTotalValue();
  ids.forEach(id=>{
    const p = products.find(x=>x.id===id);
    p.stock = Math.max(0, p.stock - cart[id]);
  });
  invoiceCounter += 1;
  const invoice = String(invoiceCounter).padStart(4,'0');
  const sale = {id:uid(), date:Date.now(), items, total, client, invoice};
  sales.push(sale);

  // Generar y compartir el PDF de inmediato, dentro del mismo toque del
  // botón (así el menú de compartir de iOS no se bloquea).
  handleReceipt(sale);
  cart = {};
  closeSheet();
  setScreen('vender');

  // Guardar en la base de datos después, sin bloquear lo anterior.
  await saveProducts();
  await saveSales();
  await saveInvoiceCounter();
}

function generateReceiptPdf(sale){
  const { jsPDF } = window.jspdf;
  const widthMm = 80;
  const marginMm = 4;
  const lh = 4.6;
  let lines = 3; // top padding + biz name + gap
  if(settings.address) lines += 1;
  if(settings.phone) lines += 1;
  lines += 4; // fecha, factura
  if(sale.client && sale.client.name) lines += 1;
  if(sale.client && sale.client.address) lines += 1;
  lines += sale.items.length * 2;
  lines += 6; // subtotal/unidades/total/thanks/paddings
  const heightMm = Math.max(50, marginMm*2 + lines*lh);

  const doc = new jsPDF({unit:'mm', format:[widthMm, heightMm]});
  const cx = widthMm/2;
  let y = marginMm + 3;

  doc.setFont('courier','bold');
  doc.setFontSize(13);
  doc.text(settings.storeName||'Mi Tienda', cx, y, {align:'center'}); y += lh;
  doc.setFontSize(9);
  if(settings.address){ doc.text(settings.address, cx, y, {align:'center'}); y += lh-1; }
  if(settings.phone){ doc.text('Tel: '+settings.phone, cx, y, {align:'center'}); y += lh-1; }
  y += 1;
  doc.setLineDash([0.8,0.8],0);
  doc.line(marginMm, y, widthMm-marginMm, y); y += lh-1.5;
  doc.setLineDash([],0);

  const d = new Date(sale.date);
  doc.text('Fecha: '+d.toLocaleDateString('es'), marginMm, y); y += lh-1.5;
  doc.text('Factura No.: '+sale.invoice, marginMm, y); y += lh-1.5;
  if(sale.client && sale.client.name){ doc.text('Cliente: '+sale.client.name, marginMm, y); y += lh-1.5; }
  if(sale.client && sale.client.address){ doc.text('Dirección: '+sale.client.address, marginMm, y); y += lh-1.5; }
  y += 1;
  doc.setLineDash([0.8,0.8],0);
  doc.line(marginMm, y, widthMm-marginMm, y); y += lh-1.5;
  doc.setLineDash([],0);

  sale.items.forEach(it=>{
    doc.setFontSize(9);
    doc.text(`${it.qty} ${it.name}`, marginMm, y);
    doc.text(money(it.price*it.qty), widthMm-marginMm, y, {align:'right'});
    y += lh-1.8;
    doc.setFontSize(8);
    doc.text(money(it.price) + (it.code?'  '+it.code:''), marginMm, y);
    y += lh-1.5;
  });
  y += 0.5;
  doc.setLineDash([0.8,0.8],0);
  doc.line(marginMm, y, widthMm-marginMm, y); y += lh-1.5;
  doc.setLineDash([],0);

  const totalUnidades = sale.items.reduce((a,it)=>a+it.qty,0);
  doc.setFontSize(9);
  doc.text('Subtotal', marginMm, y); doc.text(money(sale.total), widthMm-marginMm, y, {align:'right'}); y += lh-1.5;
  doc.text('Total Unidades', marginMm, y); doc.text(String(totalUnidades), widthMm-marginMm, y, {align:'right'}); y += lh-1.5;
  doc.setFontSize(11);
  doc.text('TOTAL A PAGAR', marginMm, y); doc.text(money(sale.total), widthMm-marginMm, y, {align:'right'}); y += lh+0.5;
  doc.setFontSize(9);
  doc.text('¡Gracias por su compra!', cx, y, {align:'center'});

  return doc;
}

async function handleReceipt(sale){
  const doc = generateReceiptPdf(sale);
  const blob = doc.output('blob');
  const fileName = `factura-${sale.invoice}.pdf`;
  try{
    const file = new File([blob], fileName, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:fileName});
      return;
    }
  }catch(e){ /* si cancela o falla, cae a la descarga de abajo */ }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 8000);
}

// ---- settings ----
function openSettings(){
  const body = `
    <div class="sheet-close"><button onclick="closeSheet()">✕</button></div>
    <h2>Datos del negocio</h2>
    <label>Nombre del negocio</label>
    <input id="s_name" value="${escapeHtml(settings.storeName||'')}" placeholder="Mi Tienda">
    <label>Dirección (aparece en el recibo)</label>
    <input id="s_addr" value="${escapeHtml(settings.address||'')}" placeholder="Opcional">
    <label>Teléfono (aparece en el recibo)</label>
    <input id="s_phone" value="${escapeHtml(settings.phone||'')}" placeholder="Opcional">
    <button class="btn btn-primary" onclick="saveSettingsForm()">Guardar</button>
    <label style="margin-top:24px;">Respaldo de datos</label>
    <button type="button" class="btn btn-outline" onclick="exportBackup()">⬇️ Descargar respaldo</button>
    <input type="file" accept="application/json" id="f_restore" style="display:none" onchange="importBackup(event)">
    <button type="button" class="btn btn-outline" onclick="document.getElementById('f_restore').click()">⬆️ Restaurar desde respaldo</button>
  `;
  showSheet(body);
}
function exportBackup(){
  const data = {products, sales, settings, invoiceCounter, clients};
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'respaldo-mi-tienda.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importBackup(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try{
      const data = JSON.parse(e.target.result);
      products = data.products || [];
      sales = data.sales || [];
      settings = data.settings || settings;
      invoiceCounter = data.invoiceCounter || 0;
      clients = data.clients || [];
      await saveAll();
      document.getElementById('storeTitle').textContent = settings.storeName || 'Mi Tienda';
      alert('Respaldo restaurado correctamente.');
      closeSheet();
      render();
    }catch(err){ alert('Ese archivo no es un respaldo válido.'); }
  };
  reader.readAsText(file);
}
async function saveSettingsForm(){
  settings = {
    storeName: document.getElementById('s_name').value.trim() || 'Mi Tienda',
    address: document.getElementById('s_addr').value.trim(),
    phone: document.getElementById('s_phone').value.trim()
  };
  await saveSettings();
  document.getElementById('storeTitle').textContent = settings.storeName;
  closeSheet();
}

// ---- product sheet ----
let editingId = null;
let selectedEmoji = '📦';
let pendingPhoto = null;

function openAddProduct(id){
  editingId = id || null;
  const p = id ? products.find(x=>x.id===id) : null;
  selectedEmoji = p ? (p.emoji||'📦') : '📦';
  pendingPhoto = p ? (p.photo||null) : null;
  const body = `
    <div class="sheet-close"><button onclick="closeSheet()">✕</button></div>
    <h2>${p ? 'Editar producto' : 'Nuevo producto'}</h2>

    <label>Código de barras / QR (opcional)</label>
    <div class="field-row">
      <input id="f_code" value="${p?escapeHtml(p.code||''):''}" placeholder="Escanea o escribe el código">
      <button type="button" class="icon-btn" onclick="openScanner()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3"/><path d="M7 8v8M11 8v8M14 8v8M17 8v8"/></svg>
      </button>
    </div>

    <label>Foto del producto</label>
    <div class="photo-preview" id="photoPreview">${pendingPhoto ? `<img src="${pendingPhoto}">` : 'Sin foto todavía'}</div>
    <input type="file" accept="image/*" capture="environment" id="f_photo_input" style="display:none" onchange="handlePhotoSelected(event)">
    <button type="button" class="btn btn-outline" onclick="document.getElementById('f_photo_input').click()">📷 Tomar foto</button>

    <label>Nombre</label>
    <input id="f_name" value="${p?escapeHtml(p.name):''}" placeholder="Ej: Pan de huevo">
    <label>Categoría</label>
    <input id="f_cat" value="${p?escapeHtml(p.category||''):''}" placeholder="Ej: Alimentos">
    <label>Precio de venta</label>
    <input id="f_price" type="number" inputmode="decimal" value="${p?p.price:''}" placeholder="0.00">
    <label>Cantidad disponible</label>
    <input id="f_stock" type="number" inputmode="numeric" value="${p?p.stock:''}" placeholder="0">
    <label>Ícono (se usa si no hay foto)</label>
    <div class="emoji-row" id="emojiRow">${EMOJIS.map(e=>`<button type="button" class="${e===selectedEmoji?'sel':''}" onclick="pickEmoji('${e}')">${e}</button>`).join('')}</div>
    <button class="btn btn-primary" onclick="saveProduct()">${p?'Guardar cambios':'Agregar producto'}</button>
    ${p?'<button class="btn btn-danger" onclick="deleteProduct()">Eliminar producto</button>':''}
  `;
  showSheet(body);
}
function pickEmoji(e){
  selectedEmoji = e;
  document.querySelectorAll('#emojiRow button').forEach(b=>b.classList.toggle('sel', b.textContent===e));
}

function handlePhotoSelected(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = e => { img.src = e.target.result; };
  img.onload = () => {
    const maxDim = 500;
    let w = img.width, h = img.height;
    if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
    else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    pendingPhoto = canvas.toDataURL('image/jpeg', 0.6);
    document.getElementById('photoPreview').innerHTML = `<img src="${pendingPhoto}">`;
  };
  reader.readAsDataURL(file);
}

async function saveProduct(){
  const name = document.getElementById('f_name').value.trim();
  const cat = document.getElementById('f_cat').value.trim() || 'General';
  const price = parseFloat(document.getElementById('f_price').value) || 0;
  const stock = parseInt(document.getElementById('f_stock').value) || 0;
  const code = document.getElementById('f_code').value.trim();
  if(!name) return;
  if(editingId){
    const p = products.find(x=>x.id===editingId);
    Object.assign(p, {name, category:cat, price, stock, emoji:selectedEmoji, code, photo:pendingPhoto});
  } else {
    products.push({id:uid(), name, category:cat, price, stock, emoji:selectedEmoji, code, photo:pendingPhoto});
  }
  await saveProducts();
  closeSheet();
  render();
}
async function deleteProduct(){
  products = products.filter(x=>x.id!==editingId);
  await saveProducts();
  closeSheet();
  render();
}

// ---- barcode / qr scanner ----
let html5QrCode = null;
let scannerMode = 'form';
let lastScanCode = null, lastScanTime = 0;

function openScanner(mode){
  scannerMode = mode || 'form';
  document.getElementById('scannerOverlay').classList.add('show');
  document.querySelector('#scannerOverlay .scanner-hint').textContent = scannerMode==='sell'
    ? 'Apunta la cámara al código del producto para agregarlo al carrito'
    : 'Apunta la cámara al código de barras o QR del producto';
  html5QrCode = new Html5Qrcode("scannerRegion", {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.UPC_EAN_EXTENSION,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  });
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 270, height: 120 } },
    (decodedText) => onScanSuccess(decodedText),
    () => {}
  ).catch(() => {
    document.querySelector('#scannerOverlay .scanner-hint').textContent = 'No se pudo abrir la cámara. Revisa los permisos de cámara en Ajustes.';
  });
}

function onScanSuccess(decodedText){
  if(scannerMode === 'form'){
    const codeInput = document.getElementById('f_code');
    if(codeInput) codeInput.value = decodedText;
    stopScanner();
    return;
  }
  // Modo venta: agregar directo al carrito, evitando duplicados del mismo
  // código si la cámara lo vuelve a leer en el siguiente cuadro.
  const now = Date.now();
  if(decodedText === lastScanCode && (now - lastScanTime) < 1500) return;
  lastScanCode = decodedText;
  lastScanTime = now;
  const hint = document.querySelector('#scannerOverlay .scanner-hint');
  const p = products.find(x => x.code && x.code === decodedText);
  if(!p){
    hint.textContent = `❌ Código no encontrado: ${decodedText}`;
  } else if(p.stock <= (cart[p.id]||0)){
    hint.textContent = `⚠️ ${p.name}: ya no queda disponible`;
  } else {
    addToCart(p.id);
    hint.textContent = `✅ Agregado: ${p.name}`;
  }
}

function stopScanner(){
  if(html5QrCode){
    html5QrCode.stop().then(()=>{ html5QrCode.clear(); html5QrCode=null; }).catch(()=>{});
  }
  document.getElementById('scannerOverlay').classList.remove('show');
  if(scannerMode === 'sell') render();
}

// ---- sheet helper ----
function showSheet(innerHtml){
  document.getElementById('sheetHost').innerHTML = `<div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()"><div class="sheet">${innerHtml}</div></div>`;
}
function closeSheet(){ document.getElementById('sheetHost').innerHTML=''; }

loadData();
</script>
